<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Wave Glow -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Fill Gradient -->
    <linearGradient id="wave-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </linearGradient>

    <!-- Studio Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Studio Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Top Header UI -->
  <g transform="translate(60, 60)">
    <!-- Terminal Monogram & Title -->
    <rect width="44" height="44" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <text x="22" y="27" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">🎙️</text>
    
    <text x="58" y="20" font-family="sans-serif" font-size="16" font-weight="600" fill="#f4f4f5">VOICE ENHANCEMENT ENGINE</text>
    <text x="58" y="38" font-family="monospace" font-size="11" fill="#71717a">SPECTRUM SUBTRACTIVE NOISE REDUCTION • 48kHz 24-BIT</text>

    <!-- Status Pill -->
    <rect x="940" y="8" width="140" height="28" rx="14" fill="#052e16" stroke="#15803d" stroke-width="1" />
    <circle cx="958" cy="22" r="4" fill="#22c55e" />
    <text x="970" y="26" font-family="monospace" font-size="11" font-weight="600" fill="#86efac">STUDIO ACTIVE</text>
  </g>

  <!-- Main Spectral Waveform Flow -->
  <g transform="translate(0, 335)">
    <!-- Wave Fill Underneath -->
    <path d="M 0,0 
             C 100,-80 180,-140 280,-40
             C 380,60 440,-180 540,-120
             C 640,-60 700,-220 820,-160
             C 940,-100 1020,-180 1120,-60
             C 1160,-20 1190,0 1200,0
             L 1200,200 L 0,200 Z" 
          fill="url(#wave-fill)" />

    <!-- Glowing Waveform Core Stroke -->
    <path d="M 0,0 
             C 100,-80 180,-140 280,-40
             C 380,60 440,-180 540,-120
             C 640,-60 700,-220 820,-160
             C 940,-100 1020,-180 1120,-60
             C 1160,-20 1190,0 1200,0" 
          fill="none" 
          stroke="url(#wave-grad)" 
          stroke-width="4.5" 
          stroke-linecap="round"
          filter="url(#glow)" />

    <!-- Before Wave (Dull Gray Ambient Noise Profile) -->
    <path d="M 0,10 
             C 80,40 160,20 240,60
             C 320,100 400,30 480,80
             C 560,130 640,40 720,90
             C 800,140 880,50 960,110
             C 1040,160 1120,40 1200,70" 
          fill="none" 
          stroke="#52525b" 
          stroke-width="2" 
          stroke-dasharray="4 6" 
          opacity="0.45" />
  </g>

  <!-- Equalizer Frequency Frequency Bars & Metrics (Bottom) -->
  <g transform="translate(60, 520)">
    <!-- Metrics Boxes -->
    <rect x="0" y="0" width="240" height="80" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="20" y="30" font-family="monospace" font-size="11" fill="#71717a">NOISE SUPPRESSION</text>
    <text x="20" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">-32.4 dB</text>

    <rect x="260" y="0" width="240" height="80" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="280" y="30" font-family="monospace" font-size="11" fill="#71717a">DYNAMIC RANGE</text>
    <text x="280" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#a855f7">1:3.8 COMP</text>

    <rect x="520" y="0" width="240" height="80" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="540" y="30" font-family="monospace" font-size="11" fill="#71717a">VOCAL PRESENCE</text>
    <text x="540" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f43f5e">+4.2 dB @ 3kHz</text>

    <rect x="780" y="0" width="300" height="80" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="800" y="30" font-family="monospace" font-size="11" fill="#71717a">PROCESSING LATENCY</text>
    <text x="800" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="#22c55e">&lt; 120ms (REALTIME)</text>
  </g>
</svg>
