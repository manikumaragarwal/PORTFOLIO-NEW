<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#000" />
    </filter>
  </defs>

  <!-- Pink Cookie (Bánh Phục Linh) -->
  <g transform="translate(15, 20)" filter="url(#soft-shadow)">
    <!-- Base Mold Shape -->
    <path d="M40,10 C60,5 75,15 75,35 C75,55 55,65 35,65 C15,65 5,50 5,30 C5,10 20,15 40,10 Z" 
          fill="#fce7f3" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stamped Floral Filigree -->
    <path d="M40,18 C48,22 55,28 55,36 C55,48 44,52 35,52 C26,52 18,44 18,34 C18,24 28,18 40,18 Z" 
          fill="none" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="3,2" />
    
    <!-- Central Flower Details -->
    <circle cx="36" cy="35" r="5" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5" />
    <path d="M36,25 L36,45 M26,35 L46,35 M29,28 L43,42 M29,42 L43,28" 
          stroke="#db2777" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Traditional Border Petals -->
    <circle cx="20" cy="22" r="3" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2" />
    <circle cx="58" cy="24" r="3" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2" />
    <circle cx="62" cy="46" r="3" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2" />
    <circle cx="22" cy="50" r="3" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.2" />
  </g>

  <!-- Green Pandan Cookie (Bánh Phục Linh) -->
  <g transform="translate(90, 10)" filter="url(#soft-shadow)">
    <!-- Base Mold Shape -->
    <path d="M45,12 C70,8 85,20 85,42 C85,62 65,72 40,72 C18,72 8,55 8,35 C8,15 22,16 45,12 Z" 
          fill="#dcfce7" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stamped Floral Filigree -->
    <path d="M45,20 C56,24 64,32 64,42 C64,55 52,60 40,60 C28,60 20,50 20,38 C20,26 30,20 45,20 Z" 
          fill="none" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="3,2" />
    
    <!-- Central Leaf Details -->
    <circle cx="42" cy="40" r="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
    <path d="M42,28 L42,52 M30,40 L54,40 M34,32 L50,48 M34,48 L50,32" 
          stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Traditional Border Petals -->
    <circle cx="24" cy="25" r="3.5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2" />
    <circle cx="68" cy="28" r="3.5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2" />
    <circle cx="70" cy="54" r="3.5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2" />
    <circle cx="26" cy="58" r="3.5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2" />
  </g>
</svg>
